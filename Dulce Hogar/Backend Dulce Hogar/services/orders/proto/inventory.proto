syntax = "proto3";

package inventory;

// El servicio que ofrecerá Inventory
service InventoryService {
  rpc CheckStock (StockRequest) returns (StockResponse);
}

// Lo que recibe la petición
message StockRequest {
  int32 product_id = 1;
  int32 cantidad_solicitada = 2;
}

// Lo que responde el servidor
message StockResponse {
  bool disponible = 1;
  string mensaje = 2;
  float precio_unitario = 3;
}