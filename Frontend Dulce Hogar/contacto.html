<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contacto | Dulce Hogar</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/estilo.css"
    >

</head>

<body>

    <header class="encabezado">

        <div class="container">

            <h1>Dulce Hogar</h1>

            <p>
                Estamos para ayudarte
            </p>

        </div>

    </header>


    <nav class="navbar navbar-expand-lg navbar-dark navegacion">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html"
            >
                Dulce Hogar
            </a>

            <div>

                <a
                    href="index.html"
                    class="btn btn-link text-white"
                >
                    Inicio
                </a>

                <a
                    href="productos.html"
                    class="btn btn-link text-white"
                >
                    Productos
                </a>

            </div>

        </div>

    </nav>


    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <h2 class="titulo-seccion">
                    Contáctanos
                </h2>

                <form id="formulario-contacto">

                    <div class="mb-3">

                        <label
                            for="nombre"
                            class="form-label"
                        >
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="tipo"
                            class="form-label"
                        >
                            Tipo de mensaje
                        </label>

                        <select
                            id="tipo"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Seleccione
                            </option>

                            <option value="consulta">
                                Consulta
                            </option>

                            <option value="sugerencia">
                                Sugerencia
                            </option>

                            <option value="reclamo">
                                Reclamo
                            </option>

                            <option value="reseña">
                                Reseña
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label
                            for="mensaje"
                            class="form-label"
                        >
                            Mensaje
                        </label>

                        <textarea
                            id="mensaje"
                            class="form-control"
                            rows="5"
                            required
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn boton-principal"
                    >
                        Enviar
                    </button>

                </form>


                <div
                    id="respuesta"
                    class="mt-4"
                >
                </div>

            </div>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Dulce Hogar
        </p>

    </footer>


    <script src="js/contacto.js"></script>

</body>

</html>
