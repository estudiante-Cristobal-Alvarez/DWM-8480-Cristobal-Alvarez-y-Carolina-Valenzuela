<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Productos | Dulce Hogar</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link
        rel="stylesheet"
        href="css/estilo.css"
    >

</head>

<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">

        <div class="container">

            <h1>Dulce Hogar</h1>

            <p>
                Nuestros productos
            </p>

        </div>

    </header>


    <!-- NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark navegacion">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html"
            >
                Dulce Hogar
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
                aria-controls="menu"
                aria-expanded="false"
                aria-label="Abrir menú"
            >
                <span class="navbar-toggler-icon"></span>
            </button>


            <div
                class="collapse navbar-collapse"
                id="menu"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="index.html"
                        >
                            Inicio
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="productos.html"
                        >
                            Productos
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="contacto.html"
                        >
                            Contacto
                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="container my-5">

        <!--
            Este título será modificado por productos.js.

            Ejemplo:
            productos.html?categoria=panaderia
            mostrará "Panadería".
        -->

        <h2
            id="titulo-categoria"
            class="titulo-seccion"
        >
            Catálogo de productos
        </h2>


        <p class="text-center mb-4">
            Selecciona un producto para conocer sus detalles.
        </p>


        <!--
            Aquí JavaScript insertará automáticamente
            todos los productos.
        -->

        <div
            id="lista-productos"
            class="productos-grid"
        >
        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <div class="container">

            <p>
                © 2026 Dulce Hogar
            </p>

        </div>

    </footer>


    <!-- JAVASCRIPT DE PRODUCTOS -->
    <script src="js/productos.js"></script>


    <!-- BOOTSTRAP -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
