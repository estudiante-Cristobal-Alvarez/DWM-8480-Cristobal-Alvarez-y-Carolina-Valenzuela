<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Ejemplo Responsivo Bootstrap</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
</head>

<body>

    <div class="container-fluid mt-3">

        <!-- ENCABEZADO -->
        <div class="row">
            <div class="col-12 bg-dark text-white text-center p-4">
                <h1>Diseño Responsivo con Bootstrap</h1>
            </div>
        </div>

        <div class="row">
            <div class="col-12 bg-warning text-center p-3">
                <strong>Sección principal</strong>
            </div>
        </div>

        <div class="row">
            <div class="col-12 col-md-8 bg-info p-3">
                Área grande
            </div>

            <div class="col-12 col-md-4 bg-danger text-white p-3">
                Área pequeña
            </div>
        </div>

        <div class="row">
            <div class="col-12 col-md-4 bg-warning p-3 text-end">
                Izquierda
            </div>

            <div class="col-12 col-md-4 bg-success text-white p-3 text-center">
                Centro
            </div>

            <div class="col-12 col-md-4 bg-info p-3 text-start">
                Derecha
            </div>
        </div>

        <div class="row">
            <div class="col-12 col-md-4">
                <p class="fs-1 text-center bg-secondary text-white p-3">
                    Texto grande
                </p>
            </div>

            <div class="col-12 col-md-4">
                <p class="fs-6 text-center bg-secondary text-white p-3">
                    Texto pequeño
                </p>
            </div>
        </div>

    </div>

</body>
</html>
