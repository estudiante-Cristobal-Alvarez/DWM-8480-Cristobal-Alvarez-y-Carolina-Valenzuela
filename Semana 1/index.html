<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Ejemplo Responsivo Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
</head>

<body>
<div class="container-fluid mt-3">


    <!-- ENCABEZADO -->
    <div class="row">
        <div class="col-12 bg-dark text-white text-center p-4">

            <h1>Diseño Responsivo con Bootstrap</h1>
        </div>
    </div>
    
    <!-- FILA COMPLETA -->
    <div class="row">
        <div class="col-12 bg-warning text-center p-3">
            <strong>
                Sección principal 
            </strong>
        </div>
    </div>

    <!-- FILA 1 -->
    <div class="row">
        <div class="col-12 col-md-3 bg-primary text-white p-3">Menú lateral<br></div>
        <div class="col-12 col-md-6 bg-secondary text-white p-3">Contenido principal<br></div>
        <div class="col-12 col-md-3 bg-success text-white p-3">Información<br></div>
    </div>
    <!-- FILA 2 -->
    <div class="row">
        <div class="col-12 col-md-4 bg-danger text-white p-3">Característica 1<br></div>
        <div class="col-12 col-md-4 bg-warning p-3">Característica 2<br></div>
        <div class="col-12 col-md-4 bg-info p-3">Característica 3<br></div>
    </div>
    <!-- FILA 3 -->
    <div class="row">
        <div class="col-12 col-sm-6 col-lg-2 bg-dark text-white p-3">Columna A</div>
        <div class="col-12 col-sm-6 col-lg-4 bg-primary text-white p-3">Columna B</div>
        <div class="col-12 col-sm-6 col-lg-3 bg-success text-white p-3">Columna C</div>
        <div class="col-12 col-sm-6 col-lg-3 bg-secondary text-white p-3">Columna D</div>
    </div>
    <!-- FILA 4 -->
    <div class="row">
        <div class="col-12 col-md-8 bg-info p-3">Área grande<br></div>
        <div class="col-12 col-md-4 bg-danger text-white p-3">Área pequeña<br></div>
    </div>
